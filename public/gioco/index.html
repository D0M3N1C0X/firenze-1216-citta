  <script type="module">const g={stato:"bozza 0.1 del 15 settembre 2026. Da provare su carta con un docente e da rivedere con un medievista.",inizio:"P1",paginaId:"V8",tipi:{visto:{nome:"visto",testo:"il notaio l'ha visto con i propri occhi",colore:"#3f7a52"},riferito:{nome:"riferito",testo:"gliel'ha raccontato qualcuno senza un interesse diretto",colore:"#8a6a2f"},"di parte":{nome:"di parte",testo:"gliel'ha raccontato qualcuno che ha un interesse",colore:"#a23b32"},documento:{nome:"documento",testo:"è scritto in un atto",colore:"#5d4a8a"}},personaggi:[{nome:"Il notaio",stato:"invenzione",ruolo:"La classe. Giovane allievo di Sanzanome"},{nome:"Sanzanome",stato:"reale; dialoghi ricostruiti",ruolo:"Il maestro, giudice e notaio. Nei Gesta Florentinorum tace sul delitto"},{nome:"Buondelmonte dei Buondelmonti",stato:"reale",ruolo:"Non parla mai"},{nome:"Uberto degli Infangati",stato:"reale; dialoghi ricostruiti",ruolo:"Amico di Buondelmonte, offeso al convito"},{nome:"Oddo Arrighi dei Fifanti",stato:"reale; dialoghi ricostruiti",ruolo:"Il ferito; guida la vendetta"},{nome:"Lambertuccio degli Amidei",stato:"reale; dialoghi ricostruiti",ruolo:"Padre della promessa sposa"},{nome:"La figlia di Lambertuccio",stato:"reale, nome non tramandato",ruolo:"La sposa abbandonata. Non le diamo un nome: le cronache non l'hanno conservato"},{nome:"Gualdrada Donati",stato:"reale («Aldruda» in Compagni)",ruolo:"Offre la figlia a Buondelmonte"},{nome:"Mosca dei Lamberti",stato:"reale; parole dalle cronache",ruolo:"«Cosa fatta capo ha»"},{nome:"Schiatta degli Uberti",stato:"reale",ruolo:"Abbatte Buondelmonte; non parla"},{nome:"Un giullare",stato:"reale, anonimo nella fonte",ruolo:"Toglie il tagliere a Uberto"},{nome:"Cilia, fantesca in casa Donati",stato:"invenzione",ruolo:"Sa della chiamata segreta"},{nome:"Prete Giunta, che serve in Santa Maria sopra Porta",stato:"invenzione",ruolo:"Ha sentito il consiglio dalla sacrestia"},{nome:"Bartolo, fante dei Lamberti",stato:"invenzione",ruolo:"Riferisce le parole di Mosca"},{nome:"Neri, garzone di un mercante d'Oltrarno",stato:"invenzione",ruolo:"Testimone al ponte"},{nome:"Il messo del podestà",stato:"invenzione",ruolo:"La voce del Comune"}],tempi:[{parte:"Prologo",minuti:3,breve:0},{parte:"Atto I",minuti:8,breve:8},{parte:"Atto II",minuti:8,breve:5},{parte:"Atto III",minuti:8,breve:8},{parte:"Atto IV",minuti:9,breve:9},{parte:"Atto V",minuti:10,breve:10},{parte:"Epilogo",minuti:4,breve:4}],note:{N02:{tipo:"visto",testo:"«Un giullare tolse il tagliere a Uberto degli Infangati. Oddo Arrighi lo insultò e, dopo la risposta di Uberto, gli gettò in faccia un tagliere di carne.»",schermata:"I2a"},N03:{tipo:"visto",testo:"«Uberto degli Infangati diede del bugiardo a Oddo Arrighi davanti a tutti. Oddo gli gettò in faccia un tagliere di carne.»",schermata:"I2b"},N04:{tipo:"riferito",testo:"«Un servitore dice che fu Oddo Arrighi a far togliere il tagliere a Uberto, per deriderlo.»",schermata:"I2c"},N05:{tipo:"visto",testo:"«Dopo il convito, Buondelmonte ferì Oddo Arrighi al braccio con un coltello.»",schermata:"I3"},N06:{tipo:"di parte",chi:"un uomo dei Fifanti",testo:"«Lo colpì a freddo, a festa finita.»",schermata:"I3"},N07:{tipo:"di parte",chi:"Uberto degli Infangati",testo:"«Oddo cercava la rissa; Buondelmonte difese l'onore di un amico.»",schermata:"I3"},N08:{tipo:"di parte",chi:"Lambertuccio degli Amidei",testo:"«Il matrimonio chiude la ferita. Chi giura davanti a tutti non torna indietro.»",schermata:"II1"},N09:{tipo:"di parte",chi:"Uberto degli Infangati",testo:"«In città c'è chi dice che Buondelmonte ha accettato per paura degli Uberti e dei Fifanti. E questo gli brucia.»",schermata:"II1"},N10:{tipo:"riferito",chi:"Cilia, fantesca dei Donati",testo:"«Madonna Gualdrada chiamò in segreto Buondelmonte, gli offrì la figlia e gli disse che aveva preso moglie per paura.»",schermata:"II2"},N11a:{tipo:"visto",testo:"«Ruppe la pace giurata.»",schermata:"II3"},N11b:{tipo:"visto",testo:"«Scelse un'altra sposa.»",schermata:"II3"},N11c:{tipo:"visto",testo:"«Lasciò la figlia di Lambertuccio davanti a tutti.»",schermata:"II3"},N23:{tipo:"visto",testo:"«Contando dalla Pasqua del 10 aprile, oggi è mercoledì.»",schermata:"II3"},N12:{tipo:"riferito",chi:"prete Giunta",testo:"«Qualcuno voleva bastonarlo. Altri volevano sfregiarlo in faccia, perché ne portasse il segno per sempre. Poi ha parlato messer Mosca, e nessuno ha più aggiunto nulla.»",schermata:"III1"},N13:{tipo:"di parte",chi:"Bartolo, fante dei Lamberti",testo:"«Messer Mosca ha detto: se lo bastoni o lo ferisci, preparati prima la fossa. Colpiscilo in modo che si veda. Cosa fatta capo ha.»",schermata:"III1"},N14:{tipo:"di parte",chi:"Uberto degli Infangati",testo:"«Hanno deciso di ammazzarlo a sangue freddo.»",schermata:"III1"},N15:{tipo:"di parte",chi:"il Comune",testo:"«Il Comune non interviene nelle faccende tra casate senza un'accusa.»",schermata:"III3a"},N16:{tipo:"visto",testo:"«Buondelmonte passò il ponte a cavallo, venendo d'Oltrarno, con un mantello chiaro. Da lontano non vidi altro.»",schermata:"IV2a"},N17:{tipo:"visto",testo:"«Uomini armati aspettavano presso le case degli Amidei. Tra loro Schiatta degli Uberti, con una mazza.»",schermata:"IV2b"},N18:{tipo:"riferito",chi:"Neri",testo:"«Era vestito tutto di bianco, su un palafreno bianco. Sembrava uno sposo.»",schermata:"IV3"},N19:{tipo:"di parte",chi:"casa Buondelmonti",testo:"«Giubba di seta, mantello, una ghirlanda in testa. L'hanno aspettato armati, come ladri.»",schermata:"IV3"},N20:{tipo:"di parte",chi:"casa Fifanti",testo:"«L'hanno colpito davanti a tutti, dove aveva tradito la parola. Come si deve.»",schermata:"IV3"},N21:{tipo:"di parte",chi:"il Comune",testo:"«Una rissa. L'hanno tirato giù da cavallo, la gente è accorsa, sono uscite le armi: uno ha colpito, poi un altro.»",schermata:"IV3"},N22:{tipo:"documento",testo:"«Obiit Dominus Bondelmonte. — Registro dei morti di Santa Reparata, 11 aprile.»",schermata:"IV4"}},schermate:{P1:{id:"P1",atto:{nome:"Prologo",titolo:""},titolo:"La bottega del giudice",facoltativo:!0,tipo:"scelta",testo:["Firenze, gennaio. Per te è ancora l'anno 1215: a Firenze l'anno nuovo comincia il 25 marzo.","Sei il più giovane allievo di Sanzanome, giudice e notaio. Al suo banco si scrivono contratti, testamenti, paci tra famiglie. Oggi il maestro ti consegna un quaderno.","«Annota quello che accade in città. Ma annota anche *come* lo sai: se l'hai visto, se te l'hanno detto, e chi te l'ha detto. Prova subito: chi è il podestà quest'anno?»","Due uomini al banco rispondono insieme. Uno dice «messer Gherardo Orlandi», l'altro «messer Currado Orlandi»."],regia:[],citazioni:[],base:"Sanzanome giudice e notaio: `fonte` (Faini p. 27). Il nome del podestà: **le fonti divergono**, Villani «Gherardo», pseudo-Brunetto «Currado» (pp. 10, 13). La divergenza è tra cronache scritte molto dopo; spostarla nel 1216 come esercizio è `invenzione` dichiarata. Il quaderno e le parole del maestro: `invenzione`. Il banco del notaio: `ricostruzione` **[da verificare]**.",scelte:[{testo:"Scrivi «Gherardo»",se:!0,effetti:{note:["N01"],var:{podesta:"Gherardo"},fiducia:{}},verso:"I1"},{testo:"Scrivi «Currado»",se:!0,effetti:{note:["N01"],var:{podesta:"Currado"},fiducia:{}},verso:"I1"},{testo:"Scrivi i due nomi, e chi li ha detti",se:!0,effetti:{note:["N01"],var:{podesta:"Gherardo o Currado"},fiducia:{}},verso:"I1"},{testo:"Chiedi di vedere un atto con il nome",se:!0,effetti:{note:["N01"],var:{podesta:"___"},fiducia:{},risposta:"Il maestro: «Bene. Oggi non c'è tempo: lascia lo spazio.»"},verso:"I1"}]},I1:{id:"I1",atto:{nome:"Atto I",titolo:"Il convito di Campi"},titolo:"A tavola",tipo:"scelta",testo:["Primi giorni dell'anno. A Campi, sei miglia fuori Firenze, messer Mazzingo Tegrimi dei Mazzinghi è stato fatto cavaliere, e ha invitato tutta la buona gente di Firenze. Il maestro ti ha mandato: ci saranno patti da scrivere e testimoni da contare.","Le tavole sono lunghe. Dove ti siedi?"],regia:[],citazioni:[],base:"Il convito, il luogo e l'invito a «tutta la buona gente di Firenze»: `fonte` (pseudo-Brunetto; Faini p. 13). Uberto «in compagnia» di Buondelmonte: `fonte`; che mangiassero dallo stesso tagliere è interpretazione di Faini (p. 18). La presenza del notaio: `invenzione`.",scelte:[{testo:"Accanto a messer Uberto degli Infangati, che mangia allo stesso tagliere di messer Buondelmonte",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"I2a"},{testo:"Vicino ai Fifanti, dove siede messer Oddo Arrighi",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"I2b"},{testo:"In fondo, con i giullari e i servitori",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"I2c"}],luogo:{nome:"Il castello dei Mazzinghi a Campi",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=I1&gioco"}},I2a:{id:"I2a",atto:{nome:"Atto I",titolo:"Il convito di Campi"},titolo:"Dal lato di Uberto",tipo:"racconto",testo:["Un giullare passa e porta via il tagliere pieno che sta davanti a Uberto. Uberto diventa rosso. Dall'altro capo della tavola messer Oddo Arrighi gli grida qualcosa; nel chiasso non capisci le parole, ma il tono è villano. Uberto gli risponde. Oddo afferra un tagliere carico di carne e glielo getta in faccia."],regia:[],citazioni:[],base:"Il giullare, il rimprovero «villanamente», «lo smentio per la gola», il tagliere gettato in faccia: `fonte` (pseudo-Brunetto; Faini p. 14). Che Oddo volesse deridere l'attaccamento di Uberto al cibo è un'ipotesi di Faini (p. 19); qui diventa una voce che corre tra i servitori: `invenzione` ispirata a un'ipotesi. Ciò che il notaio vede o non vede da ciascun posto: `invenzione`.",verso:"I3",automatiche:["N02"],luogo:{nome:"Il castello dei Mazzinghi a Campi",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=I2a&gioco"}},I2b:{id:"I2b",atto:{nome:"Atto I",titolo:"Il convito di Campi"},titolo:"Dal lato dei Fifanti",tipo:"racconto",testo:["Non vedi che cosa succede all'altro capo della tavola: c'è troppa gente in piedi. Poi senti la voce di Uberto degli Infangati sopra tutte: «Tu menti per la gola!». Messer Oddo Arrighi, accanto a te, afferra un tagliere carico di carne e glielo getta in faccia."],regia:[],citazioni:[{tipo:"Glossa per le superiori",testo:"«mentire per la gola» era la più classica delle offese, e alludeva all'avidità di cibo (Faini p. 19 e n. 56)."}],base:"Il giullare, il rimprovero «villanamente», «lo smentio per la gola», il tagliere gettato in faccia: `fonte` (pseudo-Brunetto; Faini p. 14). Che Oddo volesse deridere l'attaccamento di Uberto al cibo è un'ipotesi di Faini (p. 19); qui diventa una voce che corre tra i servitori: `invenzione` ispirata a un'ipotesi. Ciò che il notaio vede o non vede da ciascun posto: `invenzione`.",verso:"I3",automatiche:["N03"],luogo:{nome:"Il castello dei Mazzinghi a Campi",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=I2b&gioco"}},I2c:{id:"I2c",atto:{nome:"Atto I",titolo:"Il convito di Campi"},titolo:"In fondo alla sala",tipo:"racconto",testo:["Vedi un giullare prendere il tagliere davanti a Uberto degli Infangati e portarlo via tra le risate. Accanto a te un servitore sussurra: «Dicono che gliel'abbia fatto togliere messer Oddo, per ridere della sua fame.» Da laggiù senti solo le grida. Poi un tagliere vola sopra la tavola."],regia:[],citazioni:[],base:"Il giullare, il rimprovero «villanamente», «lo smentio per la gola», il tagliere gettato in faccia: `fonte` (pseudo-Brunetto; Faini p. 14). Che Oddo volesse deridere l'attaccamento di Uberto al cibo è un'ipotesi di Faini (p. 19); qui diventa una voce che corre tra i servitori: `invenzione` ispirata a un'ipotesi. Ciò che il notaio vede o non vede da ciascun posto: `invenzione`.",verso:"I3",automatiche:["N04"],luogo:{nome:"Il castello dei Mazzinghi a Campi",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=I2c&gioco"}},I3:{id:"I3",atto:{nome:"Atto I",titolo:"Il convito di Campi"},titolo:"A tavole sparecchiate",tipo:"scelta",testo:["Le tavole vengono tolte. Un servitore ti chiede una mano a portare fuori le panche. Da fuori senti un grido.","Quando rientri, messer Oddo Arrighi si stringe il braccio e il sangue gli cola tra le dita. Messer Buondelmonte ha ancora il coltello in mano.",`Intorno, due voci.
**Uberto degli Infangati:** «Oddo cercava la rissa da tutta la sera. Buondelmonte ha difeso l'onore di un amico.»
**Un uomo dei Fifanti:** «L'ha colpito a freddo, a festa finita. Villanamente.»`,"Stasera, cosa scrivi nel quaderno?"],regia:[],citazioni:[],base:"Buondelmonte ferisce Oddo al braccio «quando furono levate le tavole», «villanamente»: `fonte` (pseudo-Brunetto; Faini p. 14). Nella fonte «villanamente» è la voce del cronista; qui la mettiamo in bocca a un uomo dei Fifanti: `invenzione`. «Oddo cercava la rissa» riprende un'osservazione di Faini («Odarrigo, probabilmente, cercava la rissa», p. 19), messa in bocca a Uberto: `invenzione` ispirata a un'ipotesi. Il notaio fuori dalla sala: `invenzione`.",scelte:[{testo:"Solo il fatto",se:!0,effetti:{note:["N05"],var:{},fiducia:{}},verso:"II1"},{testo:"Il fatto e la versione dei Fifanti",se:!0,effetti:{note:["N05","N06"],var:{},fiducia:{Offesa:1},perche:"l'uomo dei Fifanti ti vede scrivere le sue parole"},verso:"II1"},{testo:"Il fatto e la versione di Uberto",se:!0,effetti:{note:["N05","N07"],var:{},fiducia:{Buondelmonti:1}},verso:"II1"},{testo:"Il fatto e tutte e due le versioni, con il nome di chi le ha dette",se:!0,effetti:{note:["N05","N06","N07"],var:{},fiducia:{}},verso:"II1"}],luogo:{nome:"Il castello dei Mazzinghi a Campi",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=I3&gioco"}},II1:{id:"II1",atto:{nome:"Atto II",titolo:"La pace e la promessa"},titolo:"Il consiglio della pace",facoltativo:!0,tipo:"scelta",testo:["Pochi giorni dopo, messer Oddo riunisce amici e parenti: i conti da Gangalandi, gli Uberti, i Lamberti, gli Amidei. Il sangue è corso e l'onore va riparato. Decidono la pace con un matrimonio: Buondelmonte sposerà la figlia di messer Lambertuccio degli Amidei, nipote di Oddo.","Il maestro deve occuparsi di un accordo con Bologna per conto del Comune. «Le nozze le segui tu.»","Prima della cerimonia, da chi vai a chiarire i patti?"],regia:[],citazioni:[],base:"Il consiglio, i partecipanti, la pace con il matrimonio: `fonte` (pseudo-Brunetto; Faini p. 14). Sanzanome incaricato nel febbraio 1216 di un accordo con Bologna: `fonte` (Faini p. 27) **[da verificare: data esatta, stile di datazione, e se si allontanò da Firenze]**. Il notaio incaricato delle nozze: `ricostruzione` **[da verificare: ruolo del notaio negli sponsali]**. «Per paura degli Uberti e dei Fifanti» sono parole di Gualdrada nella fonte; qui circolano prima come voce di città: `invenzione`.",scelte:[{testo:"Da messer Lambertuccio degli Amidei, il padre della sposa",se:!0,effetti:{note:["N08"],var:{},fiducia:{Offesa:1}},verso:"II2"},{testo:"Da messer Uberto degli Infangati, l'amico dello sposo",se:!0,effetti:{note:["N09"],var:{},fiducia:{Buondelmonti:1}},verso:"II2"}]},II2:{id:"II2",atto:{nome:"Atto II",titolo:"La pace e la promessa"},titolo:"Una fantesca alla porta",tipo:"scelta",testo:["La sera prima delle nozze bussa Cilia, fantesca in casa Donati: le hai scritto gratis il testamento del padre, e lei non l'ha dimenticato. Sottovoce ti dice: «Madonna Gualdrada ha fatto chiamare in segreto messer Buondelmonte e gli ha mostrato sua figlia. L'ho sentita io.»","Riferisce le sue parole: *«Cavaliere vituperato, hai preso moglie per paura degli Uberti e dei Fifanti. Lascia quella che hai presa e prendi questa, e sarai sempre onorato cavaliere.»*"],regia:[],citazioni:[{tipo:"Citazione per le superiori",testo:"«Chavaliere vitiperato, ch'hai tolto molgle per paura dell'Uberti e di Fifanti; lascia quella ch'ài presa e prendi questa, e sarai sempre inorato chavaliere.» (pseudo-Brunetto)"},{tipo:"Parafrasi per le medie",testo:"«Cavaliere senza onore, hai scelto la moglie per paura degli Uberti e dei Fifanti. Lasciala e prendi mia figlia: sarai sempre rispettato.»"}],base:"La chiamata segreta e le parole di Gualdrada: `fonte` (pseudo-Brunetto; Faini p. 14). Buondelmonte accetta «sanza alkuno consilglo»: `fonte`. Cilia e il suo racconto: `invenzione`. Il nome della donna: **le fonti divergono**, «Gualdrada moglie di Forese» nello pseudo-Brunetto, «Aldruda moglie di Forteguerra» in Compagni (pp. 12, 15). Anche se il notaio avverte Lambertuccio, la storia non cambia: principio 1.",scelte:[{testo:"Ringrazi e scrivi tutto nel quaderno",se:!0,effetti:{note:["N10"],var:{},fiducia:{}},verso:"II3"},{testo:"Corri ad avvertire messer Lambertuccio",se:!0,effetti:{note:["N10"],var:{},fiducia:{Offesa:1},risposta:"Lambertuccio ride: «Un cavaliere ha dato la sua parola davanti a tutti. Chiacchiere di serve.»"},verso:"II3"},{testo:"Le dici che le faccende delle grandi casate non ti riguardano",se:!0,effetti:{note:[],var:{},fiducia:{Donati:1}},verso:"II3"}],luogo:{nome:"Le case dei Donati",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=II2&gioco"}},II3:{id:"II3",atto:{nome:"Atto II",titolo:"La pace e la promessa"},titolo:"Giovedì 10 febbraio",tipo:"scelta",testo:["Mattina presto. Dove si deve giurare la promessa è radunata la gente delle due parti; tu hai la pergamena pronta.","Messer Buondelmonte arriva a cavallo ed entra da Porta Santa Maria. Passa davanti a tutti e va a giurare la figlia dei Donati.","La figlia di Lambertuccio resta lì, davanti a tutti. Le cronache non hanno conservato il suo nome.","La pergamena resta bianca. Nel quaderno, come scrivi quello che ha fatto Buondelmonte?","In margine: «Pasqua cade il 10 aprile. Contando all'indietro, e quest'anno febbraio ha ventinove giorni, oggi è mercoledì.»"],regia:["In margine, il quaderno porta una riga che il notaio scrive senza che il giocatore scelga:"],citazioni:[],base:"Giovedì 10 febbraio, la gente «dall'una parte e d'altra» radunata, l'ingresso da Porta Santa Maria, il giuramento con la Donati: `fonte` (pseudo-Brunetto; Faini pp. 14–16). Il luogo del raduno: la fonte dice solo che era dove si doveva giurare il matrimonio, nel cuore dei possessi dell'offeso **[da verificare: case degli Amidei o dei Fifanti]**. Il nome della sposa non è tramandato: `fonte` (silenzio delle cronache). La pergamena: `invenzione`. Il giorno della settimana: **le fonti divergono**. Lo pseudo-Brunetto scrive «giovedì die X di febraio» e Faini lo accetta (pp. 14, 16 n. 37), ma il 1216 era bisestile: dal 10 febbraio alla Pasqua del 10 aprile passano 60 giorni, e il 10 febbraio cade di mercoledì (calcolo sul calendario giuliano, verificato il 2 e il 9 ottobre 2026). Il titolo della schermata tiene la parola della cronaca; la nota in margine è `invenzione` dichiarata, che porta nel 1216 un controllo fatto oggi.",scelte:[{testo:"«Ruppe la pace giurata.»",se:!0,effetti:{note:["N11a"],var:{},fiducia:{Offesa:1,Buondelmonti:-1}},verso:"III1"},{testo:"«Scelse un'altra sposa.»",se:!0,effetti:{note:["N11b"],var:{},fiducia:{Donati:1}},verso:"III1"},{testo:"«Lasciò la figlia di Lambertuccio davanti a tutti.»",se:!0,effetti:{note:["N11c"],var:{},fiducia:{}},verso:"III1"}],automatiche:["N23"],luogo:{nome:"Porta Santa Maria",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=II3&gioco"}},III1:{id:"III1",atto:{nome:"Atto III",titolo:"Il consiglio a porte chiuse"},titolo:"Santa Maria sopra Porta",tipo:"ascolti",testo:["Messer Oddo convoca di nuovo amici e parenti, questa volta nella chiesa di Santa Maria sopra Porta. Le porte si chiudono. Tu resti fuori, sulla piazza, con il quaderno.","Quando escono, tre persone sanno qualcosa. Hai il tempo di ascoltarne due."],regia:["La classe vota due volte: la prima persona da ascoltare, poi la seconda tra le due rimaste.","Dopo due ascolti"],citazioni:[{tipo:"Citazione per le superiori",testo:"«Se tu batti o ffiedi, pensa prima di fare la fossa, dove tue ricoveri: ma dàlli tale che ssi paia, ché cosa fatta cappa à.» (pseudo-Brunetto)"},{tipo:"Glossa",testo:"chi lo colpisce senza ucciderlo si prepari la tomba, perché Buondelmonte si vendicherà; solo una cosa fatta fino in fondo è compiuta (Faini p. 16)."},{tipo:"Parafrasi per le medie",testo:"«Se lo picchi o lo ferisci soltanto, poi sarà lui a vendicarsi su di te. Una cosa fatta fino in fondo non si può più disfare.»"}],base:"Il secondo consiglio in Santa Maria sopra Porta, le proposte del bastone e della ferita al volto, le parole di Mosca, la decisione di colpire nel luogo del giuramento: `fonte` (pseudo-Brunetto; Faini pp. 15–16). Mosca «il più autorevole» del gruppo: Faini p. 21. Prete Giunta, Bartolo e ciò che hanno sentito: `invenzione`. Uberto assente e le sue parole: `invenzione`.",scelte:[{testo:"Prete Giunta, che serve nella chiesa e ha sentito dalla sacrestia",se:!0,effetti:{note:["N12"],var:{},fiducia:{}}},{testo:"Bartolo, fante dei Lamberti, rimasto sulla soglia",se:!0,effetti:{note:["N13"],var:{},fiducia:{}}},{testo:"Messer Uberto degli Infangati, che dentro non c'era",se:!0,effetti:{se:{cond:{fiducia:"Buondelmonti",op:">=",n:0},allora:{note:["N14"],var:{},fiducia:{}},altrimenti:{note:[],var:{},fiducia:{},risposta:"«Hai scritto che ha rotto la pace. Non ho niente da dirti.»"}}}}],ascolti:{quanti:2},verso:"III2",luogo:{nome:"Santa Maria sopra Porta",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=III1&gioco"}},III2:{id:"III2",atto:{nome:"Atto III",titolo:"Il consiglio a porte chiuse"},titolo:"Cosa fai di ciò che sai?",tipo:"scelta",testo:["Ora sai, o credi di sapere, che si prepara qualcosa. Un notaio scrive le paci, non le fa. Ma sei anche un cittadino di Firenze."],regia:[],citazioni:[],base:"",scelte:[{testo:"Vai dal messo del podestà",se:!0,effetti:{note:[],var:{avvisato:"podesta"},fiducia:{Comune:1,Offesa:-1}},verso:"III3a"},{testo:"Fai avvertire Buondelmonte attraverso Uberto",se:!0,effetti:{note:[],var:{avvisato:"buondelmonte"},fiducia:{Buondelmonti:1,Offesa:-2}},verso:"III3b"},{testo:"Taci: non è compito di un notaio",se:!0,effetti:{note:[],var:{avvisato:"nessuno"},fiducia:{Offesa:1}},verso:"III3c"}],luogo:{nome:"Santa Maria sopra Porta",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=III2&gioco"}},III3a:{id:"III3a",atto:{nome:"Atto III",titolo:"Il consiglio a porte chiuse"},titolo:"Il messo del podestà",tipo:"racconto",testo:["Il messo ti ascolta senza interromperti. Poi: «Faccende tra casate. Finché nessuno porta un'accusa, il Comune non entra nelle case dei cavalieri.» E ti congeda."],regia:[],citazioni:[],base:"`ricostruzione` **[da verificare: come si comportava il podestà di fronte alle vendette nel 1216]**. Gli statuti che limitano ma tollerano la vendetta nei casi gravi sono del 1322–1325 (Faini p. 17): non si possono proiettare sul 1216 senza conferma.",verso:"IV1",automatiche:["N15"]},III3b:{id:"III3b",atto:{nome:"Atto III",titolo:"Il consiglio a porte chiuse"},titolo:"Il messaggio",tipo:"racconto",testo:["Uberto torna la sera. «Gliel'ho detto. Ha riso. Dice che un cavaliere non si nasconde.» In città le voci corrono: da domani, in casa Amidei, sanno che il notaio ha parlato."],regia:[],citazioni:[],base:"`invenzione`. Nessuna fonte dice che Buondelmonte fosse stato avvertito.",verso:"IV1",luogo:{nome:"La casa del notaio (luogo del gioco)",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=III3b&gioco"}},III3c:{id:"III3c",atto:{nome:"Atto III",titolo:"Il consiglio a porte chiuse"},titolo:"Il quaderno chiuso",tipo:"racconto",testo:["Chiudi il quaderno sulla pagina del consiglio. Non scrivi altro. Anche il silenzio, pensi, è un modo di stare da una parte."],regia:[],citazioni:[],base:"`invenzione`.",verso:"IV1",luogo:{nome:"La casa del notaio (luogo del gioco)",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=III3c&gioco"}},IV1:{id:"IV1",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"La mattina di Pasqua",tipo:"scelta",testo:["Domenica 10 aprile. Il 25 marzo è passato: ora anche per te è il 1216. Le campane suonano per la Resurrezione.","Dove sei?"],regia:[],citazioni:[],base:"Pasqua il 10 aprile 1216: `fonte` (Faini p. 16). I congiurati riuniti «in casa gli Amidei da Santo Stefano»: `fonte` (Villani; Faini p. 11). Santa Reparata come cattedrale: `fonte` (obituario; Faini n. 38).",scelte:[{testo:"In Oltrarno, dove abiti, sulla strada verso il Ponte Vecchio",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"IV2a"},{testo:"Vicino alle case degli Amidei, dalle parti di Santo Stefano",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"IV2b"},{testo:"Già in cattedrale, a Santa Reparata, per la messa",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"IV2c"}],luogo:{nome:"Il Ponte Vecchio del 1216",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV1&gioco"}},IV2a:{id:"IV2a",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"Oltrarno",tipo:"racconto",testo:["Davanti a te, verso il ponte, passa un cavaliere a cavallo, con un mantello chiaro e qualcosa sul capo, forse una ghirlanda. È messer Buondelmonte. La folla ti separa da lui. Poco dopo, dall'altra parte del ponte, un urlo, poi un altro. La gente si mette a correre."],regia:[],citazioni:[],base:"Buondelmonte veniva d'Oltrarno: `fonte` (Villani; Faini p. 11); aveva casa a San Felice in Piazza: `fonte` (Stefani; Faini p. 23). Il vestito: **le fonti divergono**, «giubba di sendado», mantello e ghirlanda nello pseudo-Brunetto, «roba tutta bianca» su «palafreno bianco» in Villani (pp. 11, 15). Il testimone vede di proposito solo «chiaro»: `invenzione`.",verso:"IV3",automatiche:["N16"],luogo:{nome:"Il Ponte Vecchio del 1216",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV2a&gioco"}},IV2b:{id:"IV2b",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"Santo Stefano",tipo:"racconto",testo:["Davanti alle case degli Amidei ci sono uomini armati, più di quanti ne servano per andare a messa. Riconosci messer Schiatta degli Uberti, con una mazza in mano. Qualcuno ti vede e ti fa segno di andartene. Poco dopo, dal capo del ponte, arrivano le grida."],regia:[],citazioni:[],base:"L'agguato preparato in casa Amidei: `fonte` (pseudo-Brunetto; Faini p. 15). Schiatta degli Uberti colpisce con una mazza: `fonte` (p. 15). Il notaio che li vede prima: `invenzione`.",verso:"IV3",ingresso:[{se:{var:"avvisato",in:["buondelmonte"]},effetti:{note:[],var:{},fiducia:{Offesa:-1},risposta:"Uno degli uomini ti riconosce: «Il notaio che parla troppo.»"}}],automatiche:["N17"],luogo:{nome:"La torre degli Amidei",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV2b&gioco"}},IV2c:{id:"IV2c",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"Santa Reparata",tipo:"racconto",testo:["Durante la messa sale un rumore dalla strada, prima lontano, poi forte. Un uomo entra di corsa: «Al ponte! Hanno ammazzato un cavaliere!» La chiesa si svuota. Quando arrivi, la città è già in armi."],regia:[],citazioni:[],base:"«La città corse ad arme e romore»: `fonte` (Villani; Faini p. 11). La scena in chiesa: `invenzione`. *Nota per il docente: è il ramo di chi «non c'era». Il notaio scriverà solo ciò che gli viene raccontato.*",verso:"IV3",luogo:{nome:"Santa Reparata",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV2c&gioco"}},IV3:{id:"IV3",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"Le voci del ponte",tipo:"testimoni",testo:["Al capo del ponte, ai piedi della vecchia statua di Marte, la gente si accalca. Buondelmonte è a terra. Non ti lasciano avvicinare. Raccogli le voci."],regia:["Le testimonianze entrano nel quaderno se il testimone accetta di parlare:","Altrimenti `vestito` resta vuoto"],citazioni:[],base:"La statua di Marte al capo del ponte: `fonte` (pseudo-Brunetto e Villani; Faini pp. 11, 15). Il vestito: **le fonti divergono** (vedi IV2a). «Sendado» è una seta leggera. La rissa sfuggita di mano: `fonte` (Stefani; Faini p. 12). I testimoni sono `invenzione`: ognuno porta la versione di una cronaca diversa.",testimoni:[{chi:"Neri, garzone di un mercante d'Oltrarno",se:!0,nota:"N18"},{chi:"Un uomo di casa Buondelmonti",se:{fiducia:"Buondelmonti",op:">=",n:0},nota:"N19"},{chi:"Un uomo dei Fifanti",se:{fiducia:"Offesa",op:">=",n:0},nota:"N20"},{chi:"Il messo del podestà",se:!0,nota:"N21"}],dilemma:{se:{note:["N18","N19"],modo:"tutte"},testo:["Due persone descrivono il vestito in modo diverso. Cosa scrivi?"],scelte:[{testo:"«Vestito di bianco»",se:!0,effetti:{note:[],var:{vestito:"bianco"},fiducia:{}},verso:"IV4"},{testo:"«In giubba e mantello, con una ghirlanda»",se:!0,effetti:{note:[],var:{vestito:"ghirlanda"},fiducia:{}},verso:"IV4"},{testo:"«Le voci non concordano sul vestito»",se:!0,effetti:{note:[],var:{vestito:"incerto"},fiducia:{}},verso:"IV4"}]},verso:"IV4",luogo:{nome:"Il capo del Ponte Vecchio",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV3&gioco"}},IV4:{id:"IV4",atto:{nome:"Atto IV",titolo:"Pasqua"},titolo:"Il corteo e il registro",tipo:"racconto",testo:["Mettono Buondelmonte su una bara. La moglie, la figlia dei Donati giurata due mesi prima, gli siede accanto e gli tiene il capo in grembo, piangendo. Lo portano così per tutta Firenze.","Il giorno dopo il sagrestano di Santa Reparata ti lascia vedere il registro dei morti. Per quel giorno c'è una riga sola: *Obiit Dominus Bondelmonte.* «È morto messer Buondelmonte.»","Né come, né per mano di chi."],regia:[],citazioni:[],base:"La bara, la moglie con il capo del marito in grembo, il corteo per tutta Firenze: `fonte` (pseudo-Brunetto; Faini p. 15). L'annotazione «Obiit Dominus Bondelmonte» all'11 aprile: `fonte` (obituario di Santa Reparata, Davidsohn; Faini n. 38). Il sagrestano e la consultazione del registro: `invenzione` **[da verificare: che forma aveva l'obituario e chi poteva vederlo]**.",verso:"V0",automatiche:["N22"],luogo:{nome:"Santa Reparata",url:"https://d0m3n1c0x.github.io/firenze-1216-citta/?scena=IV4&gioco"}},V0:{id:"V0",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Il ritorno del maestro",tipo:"richieste",testo:["Sanzanome è tornato. Sfoglia il tuo quaderno in silenzio. Poi dice: «Scriverai tu la memoria di quest'anno. Ma prima ascolta chi verrà a trovarti.»","Bussano quattro volte."],regia:["Momento dei gruppi: ciascuno legge alla classe la propria richiesta dalla scheda."],citazioni:[],base:"Le quattro richieste: `invenzione`, ciascuna costruita sulla versione della cronaca più favorevole a quel gruppo. Le parole di Sanzanome: `ricostruzione` basata sull'interpretazione di Faini (pp. 26–28): i *Gesta* celebrano le vittorie esterne e ignorano il delitto, forse perché ai suoi occhi era una questione ordinaria **[da verificare con il medievista]**. Semifonte e Siena nei *Gesta*: `fonte` (Faini p. 27).",richieste:[{gruppo:"Offesa",chi:"Casa Fifanti e Amidei",testo:"Scrivi che fu una vendetta giusta, decisa in consiglio e fatta davanti a tutti. Chi rompe la pace giurata sa cosa lo aspetta."},{gruppo:"Buondelmonti",chi:"Casa Buondelmonti",testo:"Scrivi che fu ucciso a tradimento, la mattina di Pasqua, da uomini che lo aspettavano armati."},{gruppo:"Donati",chi:"Casa Donati",testo:"Non scrivere il nome di madonna Gualdrada. Non sono le donne a decidere le guerre degli uomini."},{gruppo:"Comune",chi:"Il Comune",testo:"Niente nomi. La città deve restare in pace, e le carte restano.",se:{cond:{var:"avvisato",in:["podesta"]},testo:"Tu sei venuto da noi. Il Comune se ne ricorda."}}],congedo:["Il maestro parla per ultimo: «Io scrivo le imprese di Firenze: Semifonte, la guerra con Siena. Le liti tra le casate passano. Decidi tu.»"],verso:"V1"},V1:{id:"V1",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Scrivere o tacere",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"",scelte:[{testo:"Scrivi",se:!0,effetti:{note:[],var:{},fiducia:{}},verso:"V2"},{testo:"Taci: nella memoria dell'anno non ci sarà nulla",se:!0,effetti:{note:[],var:{silenzio:"sì"},fiducia:{}},verso:"V8"}]},V2:{id:"V2",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Da dove comincia la storia?",tipo:"scelta",testo:["Il punto da cui cominci decide chi, nel racconto, ha cominciato."],regia:[],citazioni:[],base:"Stile fiorentino e datazione al 1215: `fonte` (Faini p. 16, che presenta la spiegazione come la più probabile). Il giovedì della cronaca contro il mercoledì del calendario: vedi II3. L'avviso non dà la risposta: è un esercizio di verifica su una fonte, il tema del gioco.",scelte:[{testo:"Dal convito di Campi",se:!0,effetti:{note:[],var:{inizio:"convito",anno:"MCCXV"},fiducia:{}}},{testo:"Dalla promessa rotta del 10 febbraio",se:!0,effetti:{note:[],var:{inizio:"promessa",anno:"MCCXV"},fiducia:{}}},{testo:"Dalla mattina di Pasqua",se:!0,effetti:{note:[],var:{inizio:"pasqua",anno:"MCCXVI"},fiducia:{}}}],dopo:[{se:{var:"anno",in:["MCCXV"]},testo:"Il tuo racconto comincia prima del 25 marzo, quindi la pagina porta la data 1215, anche se per noi il delitto è del 1216. Secondo lo storico Enrico Faini, anche Villani e Compagni datarono il fatto al 1215 probabilmente per questa ragione."},{se:{e:[{var:"inizio",in:["promessa"]},{note:["N23"],modo:"tutte"}]},testo:"Una cronaca scritta decenni dopo dirà che il 10 febbraio era giovedì, e anche uno storico di oggi le ha creduto. Nel margine del tuo quaderno c'è scritto mercoledì. Chi ha ragione? Contate i giorni dal 10 febbraio alla Pasqua, il 10 aprile, e ricordate che quell'anno febbraio aveva 29 giorni."}],verso:"V3"},V3:{id:"V3",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Chi era Buondelmonte?",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"«Leggiadro e bello cavaliere»: Villani. «Giovane»: Compagni e Stefani. Il cavaliere che viola le regole: pseudo-Brunetto e il Cacciaguida di Dante (Faini pp. 10–13). Nei documenti Buondelmonte nel 1216 è vedovo, non un ragazzo (p. 21): lo si rivela nell'epilogo.",scelte:[{testo:"«Un nobile e bello cavaliere»",se:!0,effetti:{note:[],var:{buondelmonte:"bello"},fiducia:{}}},{testo:"«Un cavaliere che aveva rotto la pace giurata»",se:!0,effetti:{note:[],var:{buondelmonte:"spergiuro"},fiducia:{}}},{testo:"«Un giovane innamorato»",se:!0,effetti:{note:[],var:{buondelmonte:"giovane"},fiducia:{}}},{testo:"Solo il suo nome",se:!0,effetti:{note:[],var:{buondelmonte:"nome"},fiducia:{}}}],verso:"V4"},V4:{id:"V4",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Come chiami ciò che hanno fatto?",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"«Giusto disdegno»: Dante, *Par.* XVI. «Maladetto isdegno»: Villani. La rissa: Stefani (Faini pp. 11–13). «Omicidio» è la parola di oggi, che nessuna cronaca usa per giudicare.",scelte:[{testo:"«Giusto sdegno»",se:!0,effetti:{note:[],var:{vendetta:"giusto"},fiducia:{}}},{testo:"«Maledetto sdegno»",se:!0,effetti:{note:[],var:{vendetta:"maledetto"},fiducia:{}}},{testo:"«Una rissa finita male»",se:{note:["N21"],modo:"tutte"},effetti:{note:[],var:{vendetta:"rissa"},fiducia:{}}},{testo:"«Un omicidio»",se:!0,effetti:{note:[],var:{vendetta:"omicidio"},fiducia:{}}}],verso:"V5"},V5:{id:"V5",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Chi nomini?",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"",scelte:[{testo:"Gli uccisori, con i loro nomi",se:{note:["N13","N17","N20"],modo:"una"},effetti:{note:[],var:{nomi:"uccisori"},fiducia:{}}},{testo:"Gli uccisori, con i loro nomi",se:{non:{note:["N13","N17","N20"],modo:"una"}},effetti:{note:[],var:{nomi:"si_dice"},fiducia:{},risposta:'Nessuna tua nota li nomina. Scriverai "si dice".'}},{testo:"Solo le casate",se:!0,effetti:{note:[],var:{nomi:"casate"},fiducia:{}}},{testo:"Nessuno",se:!0,effetti:{note:[],var:{nomi:"nessuno"},fiducia:{}}}],verso:"V6"},V6:{id:"V6",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"E la donna dei Donati?",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"In Villani la donna dei Donati agisce «per subsidio diaboli»; per Faini è una delle tre forme del demonio nel racconto (p. 11). *Nota per il docente: aggancio per discutere come le cronache attribuiscono la colpa alle donne.*",scelte:[{testo:"La nomini: «fu lei a convincerlo»",se:{note:["N10"],modo:"tutte"},effetti:{note:[],var:{donna:"colpa"},fiducia:{}}},{testo:"La nomini: «si dice che fu lei a convincerlo»",se:{non:{note:["N10"],modo:"tutte"}},effetti:{note:[],var:{donna:"si_dice"},fiducia:{}}},{testo:"Non la nomini",se:!0,effetti:{note:[],var:{donna:"assente"},fiducia:{}}}],verso:"V7"},V7:{id:"V7",atto:{nome:"Atto V",titolo:"La pagina"},titolo:"Come finisce la pagina?",tipo:"scelta",testo:[],regia:[],citazioni:[],base:"«Fu la cagione e cominciamento delle maladette parti» e «la città corse ad arme e romore»: `fonte` (Villani; Faini p.
